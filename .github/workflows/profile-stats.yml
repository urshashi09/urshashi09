name: Update Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&title_color=C084FC&icon_color=C084FC&text_color=c9d1d9&bg_color=0d1117
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&title_color=C084FC&text_color=c9d1d9&bg_color=0d1117
          path: assets/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: >-
            bg_color=0d1117&color=C084FC&line=C084FC&point=ffffff&area=true&hide_border=true
          output_path: assets/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: >-
            username=${{ github.repository_owner }}&theme=radical&no-frame=true&no-bg=true&column=7&margin-w=8&margin-h=8
          path: assets/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.svg

          git diff --cached --quiet || git commit -m "chore: update profile stats"

          git push
